<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioTron — Exo Telemetry</title>
    <script>
      // Apply the persisted theme before paint to avoid a flash. Light is the
      // default; the "darkMode" localStorage flag opts in to dark and is
      // toggled from the top bar.
      (function () {
        try {
          var dark = localStorage.getItem('darkMode') === 'true'
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
