services:
  app:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/exo-gui:cached
    environment:
      DATABASE_URL: postgresql://exo:exo@db:5432/exo?schema=public
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: exo
      POSTGRES_PASSWORD: exo
      POSTGRES_DB: exo
    volumes:
      - exo-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exo -d exo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  exo-db-data:
